name: Build & Release OpenWrt APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Dependency Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate Plugin Switch
        run: |
          python3 scripts/test-enable-switch.py
          node --check htdocs/luci-static/resources/view/softethermg/settings.js
          node --check htdocs/luci-static/resources/view/softethermg/overview.js
          sh -n root/etc/init.d/softethermg
          sh -n root/usr/libexec/rpcd/luci.softethermg

      - name: Build Project Packages (.apk and .ipk)
        run: |
          chmod +x scripts/build-packages.sh
          bash scripts/build-packages.sh "${{ steps.ver.outputs.version }}"

      - name: Fetch Dependency APKs (aarch64 & x86_64)
        run: |
          chmod +x scripts/fetch-dependencies.sh
          bash scripts/fetch-dependencies.sh

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-softethermg-packages
          path: release-assets/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          files: release-assets/*
          body: |
            ### 🚀 SoftEther VPN Manager for OpenWrt (${{ steps.ver.outputs.tag }})

            基于 OpenWrt 原生技术栈（纯 LuCI-JS + Shell + vpncmd/JSON-RPC）打造的 SoftEther VPN 可视化管理面板。**彻底去除 Python/Node.js 依赖，全 ARM 架构通用，纯面板模式不冲突已有服务。**

            ---

            #### 📦 资源文件说明 (Assets)

            | 文件名 | 适用平台 / 格式 | 说明 |
            | :--- | :--- | :--- |
            | **`luci-app-softethermg-*.apk`** | **OpenWrt 24.x+** (noarch 通用) | **主插件标准包** (OpenWrt 官方 noarch 规范，全架构通用) |
            | **`luci-app-softethermg-*_aarch64_cortex-a53.apk`** | **OpenWrt 24.x+** (qualcommax/filogic) | 针对 IPQ60xx / Cortex-A53 架构定制包 |
            | **`luci-app-softethermg-*_aarch64.apk`** | **OpenWrt 24.x+** (aarch64 专用) | 针对 ARM64 软路由架构锁定的主插件包 |
            | **`luci-app-softethermg-*_x86_64.apk`** | **OpenWrt 24.x+** (x86_64 专用) | 针对 x86_64 软路由架构锁定的主插件包 |
            | **`luci-app-softethermg_*_all.ipk`** | OpenWrt 21/22/23 (OPKG 格式) | 传统固件兼容主插件包 |
            | **`dependencies-openwrt-aarch64.zip`** | **ARM64 路由器** (离线依赖包) | 包含官方 `softethervpn-server`, `base`, `curl`, `jsonfilter` 的 APK 包合集 |
            | **`dependencies-openwrt-x86_64.zip`** | **x86_64 软路由** (离线依赖包) | 包含官方 `softethervpn-server`, `base`, `curl`, `jsonfilter` 的 APK 包合集 |
            | **`sha256sums.txt`** | 校验哈希文件 | 校验文件完整性 |

            ---

            #### 🛠️ 在 OpenWrt 24+ 上安装主插件 (.apk)

            ```bash
            # 将下载的 apk 上传至路由器后执行：
            apk add --allow-untrusted ./luci-app-softethermg-*.apk
            ```

            *(如果路由器无法联网，可下载对应架构的 `dependencies-openwrt-*.zip`，解压后通过 `apk add --allow-untrusted *.apk` 一同离线安装依赖)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
